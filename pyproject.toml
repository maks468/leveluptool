[project]
name = "levelup-tool"
version = "0.1.0"
description = "CRM-style outreach tool for Polish schools, backed by RSPO register data"
requires-python = ">=3.12"
dependencies = [
    "fastapi>=0.115",
    "uvicorn[standard]>=0.32",
    "sqlalchemy>=2.0",
    "alembic>=1.14",
    "pydantic>=2.9",
    "pydantic-settings>=2.6",
    "typer>=0.13",
    "pandas>=2.2",
    "rapidfuzz>=3.10",
    "pdfplumber>=0.11",
    "requests>=2.32",
    "beautifulsoup4>=4.12",
    "PyYAML>=6.0",
    "sqladmin>=0.20",
    # Headless-browser fallback for JS-rendered (SPA) school sites
    # (edupage.org, szkolnastrona.pl, ...). After installing, the browser
    # binary must be fetched once: `python -m playwright install chromium`.
    # Enrichment degrades gracefully (skips the fallback) if it's absent.
    "playwright>=1.48",
    # Drives the locally-installed, subscription-authenticated Claude Code
    # CLI for contact extraction -- NEVER the pay-as-you-go Anthropic API
    # (see llm_extract.py's module docstring for the billing-safety
    # mechanism). Enrichment falls back to regex extraction if the CLI
    # isn't installed/logged in on the host.
    "claude-agent-sdk>=0.2.125",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.3",
    "httpx>=0.27",
]

[tool.setuptools.packages.find]
where = ["src"]

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"
