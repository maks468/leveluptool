services:
  app:
    build: .
    image: levelup-crm
    restart: unless-stopped
    environment:
      # The DB path defaults to /app/data/levelup.db (see core/config.py),
      # which is the persistent volume below -- no need to set it.
      # Same-origin serving makes CORS irrelevant; set your domain only if
      # you ever run the Vite dev server against this backend.
      LEVELUP_CORS_ORIGINS: "https://YOUR-DOMAIN.example.com"
    volumes:
      - ./data:/app/data        # SQLite DB + enrichment cache + imports = your entire state
      - ./config:/app/config    # rubric weights, editable live
    expose:
      - "8322"                  # internal only -- Caddy is the public entrypoint

  caddy:
    image: caddy:2
    restart: unless-stopped
    depends_on:
      - app
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_data:/data        # TLS certificates (persist across restarts)
      - caddy_config:/config

volumes:
  caddy_data:
  caddy_config:
